name: vps-deployer

# Deployment on the VPS: copy this file to /opt/vps-deployer, create .env from .env.example, then
#   docker compose pull && docker compose up -d
# The image is built by GitHub Actions (.github/workflows/build.yml) and pushed to GHCR.

services:
  deployer:
    image: ${DEPLOYER_IMAGE:-ghcr.io/tk-05/vps-deployer:latest}
    container_name: vps-deployer
    restart: unless-stopped
    env_file: .env
    ports:
      # Only reachable over Tailscale, never public
      - "100.84.59.4:8787:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/vps-deployer/apps:/opt/vps-deployer/apps
      - ./data:/data
      - ./docker-config:/root/.docker            # ghcr.io login (read:packages) for pulling app images
      - proxy_npm-letsencrypt:/etc/letsencrypt:ro # certificate preflight check
    networks:
      - apps

networks:
  apps:
    external: true

volumes:
  proxy_npm-letsencrypt:
    external: true
